name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Analysis, app, bridge core and emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Bridge core C tests (ASan + UBSan)
        run: npm run test:c
      - name: Unit and end-to-end tests (app ↔ C bridge ↔ emulated NanoVNA)
        run: npm test
      - run: npm run build
      - name: Report bundle size
        run: |
          echo "Gzipped app bundle:"
          find app/dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) -exec gzip -c {} \; | wc -c

  firmware:
    name: ESP32-S3 firmware build (ESP-IDF v5.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the web app for the LittleFS image
        run: npm ci && npm run build
      - name: Build firmware in espressif/idf
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/project" -w /project/firmware espressif/idf:v5.3.2 \
            bash -c "idf.py set-target esp32s3 && idf.py build" 2>&1 | tee firmware-build.log
      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -nE "error:|Error|ERROR|FAILED|undefined reference|No such file|not found|CMake Error" firmware-build.log \
            | grep -v "Werror" | head -40 | while IFS= read -r line; do
              echo "::error title=firmware build::${line:0:900}"
            done
          echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -60 firmware-build.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload flashable images
        uses: actions/upload-artifact@v4
        with:
          name: resonance-bridge-esp32s3
          path: |
            firmware/build/resonance-bridge.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/littlefs.bin
            firmware/build/flasher_args.json
            firmware/build/flash_args
          if-no-files-found: warn
