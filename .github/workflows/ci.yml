name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Analysis + app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Report bundle size
        run: |
          echo "Gzipped app bundle:"
          find app/dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) -exec gzip -c {} \; | wc -c

  # Firmware builds join CI in M1, once the USB host spike compiles on hardware.
