name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Analysis, app, bridge core and emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Bridge core C tests (ASan + UBSan)
        run: npm run test:c
      - name: Unit and end-to-end tests (app ↔ C bridge ↔ emulated NanoVNA)
        run: npm test
      - run: npm run build
      - name: Report bundle size
        run: |
          echo "Gzipped app bundle:"
          find app/dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) -exec gzip -c {} \; | wc -c

  firmware:
    name: ESP32-S3 firmware build (ESP-IDF v5.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the web app for the LittleFS image
        run: npm ci && npm run build
      - name: Build firmware in espressif/idf
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/project" -w /project/firmware espressif/idf:v5.3.2 \
            bash -c "idf.py set-target esp32s3 && idf.py build" 2>&1 | tee firmware-build.log
      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -nE -A2 "error:|ERROR|FAILED|undefined reference|No such file|CMake Error" firmware-build.log \
            | head -60 | while IFS= read -r line; do
              echo "::error title=firmware build::${line:0:900}"
            done
          echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -60 firmware-build.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload flashable images
        uses: actions/upload-artifact@v4
        with:
          name: resonance-bridge-esp32s3
          path: |
            firmware/build/resonance-bridge.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/littlefs.bin
            firmware/build/flasher_args.json
            firmware/build/flash_args
          if-no-files-found: warn

  release:
    # Bumping RC_BRIDGE_VERSION (firmware/components/resonance_core/include/rc_bridge.h) and
    # merging to main publishes release v<version> with the images. Bridges on home Wi-Fi find
    # it there and offer to install it.
    name: Publish a release for a new bridge version
    needs: [web, firmware]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Is this version released yet?
        id: version
        run: |
          v=$(sed -n 's/^#define RC_BRIDGE_VERSION "\(.*\)"/\1/p' firmware/components/resonance_core/include/rc_bridge.h)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "v$v is already released."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true'
        with:
          name: resonance-bridge-esp32s3
          path: images
      - name: Create the release
        if: steps.version.outputs.new == 'true'
        run: |
          v=${{ steps.version.outputs.version }}
          cat > notes.md <<NOTES
          Bridges on home Wi-Fi offer this update in **Settings → Update the bridge**.

          To flash over USB instead (\`pip install esptool\`):

          \`\`\`
          esptool.py --chip esp32s3 -p <port> -b 460800 write_flash 0x0 bootloader.bin 0x8000 partition-table.bin 0xf000 ota_data_initial.bin 0x20000 resonance-bridge.bin 0x420000 littlefs.bin
          \`\`\`
          NOTES
          gh release create "v$v" --target "$GITHUB_SHA" --title "Resonance v$v" --notes-file notes.md --generate-notes \
            images/resonance-bridge.bin images/littlefs.bin images/bootloader/bootloader.bin \
            images/partition_table/partition-table.bin images/ota_data_initial.bin
